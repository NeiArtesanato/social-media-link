<style>
  :root {
    --bg: #f7efe9;
    --card: #fffaf7;
    --ink: #2f2a28;
    --muted: #7a6f6a;
    --line: #eaded6;
    --accent: #b5476b;
    --accent-soft: #f3dde4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 0%, #f6dfe6 0, transparent 45%),
      radial-gradient(circle at 100% 100%, #efe3d6 0, transparent 45%),
      var(--bg);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 28px 28px;
    box-shadow: 0 20px 50px -25px rgba(90, 50, 40, .25);
    text-align: center;
  }
  .avatar {
    width: 128px; height: 128px;
    margin: 0 auto;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, var(--accent), #e8b9a4);
  }
  .avatar img, .avatar .mono {
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 4px solid var(--card);
    object-fit: contain;
    display: block;
  }
  .avatar img { background: #fff; padding: 10px; }
  .avatar .mono {
    display: none;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: "Cormorant Garamond", serif;
    font-size: 56px; font-weight: 600;
  }
  .avatar.no-img img { display: none; }
  .avatar.no-img .mono { display: grid; }
  h1 { margin: 22px 0 10px; line-height: 0; }
  h1 .logo {
    width: 100%;
    max-width: 260px;
    height: auto;
    /* o JPG tem fundo branco: "multiply" faz o branco sumir no fundo do cartão */
    mix-blend-mode: multiply;
  }
  .tagline {
    margin: 0;
    font-size: 13px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  .bio strong {
    display: block;
    font-family: "Dancing Script", cursive;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--accent);
  }
  /* linha pontilhada, como a "costura" da logo */
  .bio strong::after {
    content: "";
    display: block;
    width: 56px;
    margin: 12px auto 12px;
    border-top: 2px dotted var(--accent);
    opacity: .55;
  }
  .bio {
    margin: 14px auto 28px;
    max-width: 300px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
  }
  nav { display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    font-size: 15px;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .link:hover, .link:focus-visible {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 10px 24px -14px rgba(181, 71, 107, .55);
    outline: none;
  }
  .link .icon {
    width: 38px; height: 38px; flex: none;
    border-radius: 10px;
    display: grid; place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .link .icon svg { width: 20px; height: 20px; }
  .link .label { flex: 1; text-align: left; }
  .link .arrow { color: var(--muted); transition: transform .15s ease; }
  .link:hover .arrow { transform: translateX(3px); }
  /* Botões com a identidade visual de cada plataforma */
  .link.wpp, .link.insta, .link.loja { color: #fff; border-color: transparent; }
  .link.wpp .icon, .link.insta .icon, .link.loja .icon { background: rgba(255,255,255,.2); color: #fff; }
  .link.wpp .arrow, .link.insta .arrow, .link.loja .arrow { color: rgba(255,255,255,.85); }

  .link.wpp { background: linear-gradient(135deg, #25D366, #128C7E); }
  .link.wpp:hover, .link.wpp:focus-visible { box-shadow: 0 10px 24px -12px rgba(18, 140, 126, .6); }

  .link.insta { background: linear-gradient(45deg, #FEDA75 0%, #FA7E1E 22%, #D62976 50%, #962FBF 75%, #4F5BD5 100%); }
  .link.insta:hover, .link.insta:focus-visible { box-shadow: 0 10px 24px -12px rgba(150, 47, 191, .55); }

  .link.loja { background: linear-gradient(135deg, #c95a7e, var(--accent)); }
  .link.loja:hover, .link.loja:focus-visible { box-shadow: 0 10px 24px -12px rgba(181, 71, 107, .6); }

  .link.wpp .label, .link.insta .label { text-shadow: 0 1px 2px rgba(0,0,0,.15); }
  footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .3px;
  }
</style>
</head>
<body>

  </main>
