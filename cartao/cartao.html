<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cartão digital — Néia Artesanatos</title>
<!--
  Cartão digital para enviar como FOTO no WhatsApp (1080×1350).
  Para gerar a imagem: veja a seção "Cartão digital" no CLAUDE.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #c70661;
    --ink: #2f2a28;
    --muted: #7a6f6a;
    --line: #eaded6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Inter", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #fdf8f5 0%, #f9e9ee 100%);
  }

  /* "pétalas" nas cores da flor, saindo pelos cantos */
  .petal { position: absolute; border-radius: 50%; opacity: .5; }
  .p1 { width: 300px; height: 300px; left: -110px; top: -100px; background: #a63a5a; }
  .p2 { width: 230px; height: 230px; left: 140px;  top: -150px; background: #d47b8d; }
  .p3 { width: 220px; height: 220px; left: -140px; top: 180px;  background: #146a85; }
  .p4 { width: 310px; height: 310px; right: -120px; bottom: -110px; background: #9cc157; }
  .p5 { width: 230px; height: 230px; right: 150px;  bottom: -160px; background: #6b874a; }
  .p6 { width: 220px; height: 220px; right: -140px; bottom: 190px;  background: #539fb7; }

  .card {
    position: absolute; inset: 70px;
    background: #fff;
    border-radius: 44px;
    box-shadow: 0 30px 70px -30px rgba(120, 40, 70, .35);
    display: flex; flex-direction: column; align-items: center;
    padding: 70px 70px 60px;
    text-align: center;
  }
  /* costura pontilhada */
  .card::before {
    content: ""; position: absolute; inset: 20px;
    border: 4px dotted rgba(199, 6, 97, .55);
    border-radius: 30px;
    pointer-events: none;
  }

  .top { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .logo { width: 760px; height: auto; }

  .slogan {
    margin-top: 26px;
    font-family: "Dancing Script", cursive;
    font-weight: 700;
    font-size: 64px;
    line-height: 1.1;
    white-space: nowrap;
    color: var(--pink);
  }
  .dots { width: 90px; margin: 26px auto; border-top: 5px dotted var(--pink); opacity: .5; }
  .sub { font-size: 29px; font-weight: 500; color: var(--muted); letter-spacing: .2px; }

  .bottom {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
    padding-top: 36px;
    border-top: 2px solid var(--line);
  }
  .contacts { display: flex; flex-direction: column; gap: 22px; text-align: left; }
  .row { display: flex; align-items: center; gap: 20px; font-size: 30px; font-weight: 600; }
  .ico {
    width: 64px; height: 64px; flex: none;
    border-radius: 18px;
    display: grid; place-items: center;
    color: #fff;
  }
  .ico svg { width: 36px; height: 36px; }
  .wpp   { background: #25D366; }
  .insta { background: linear-gradient(45deg, #FEDA75 0%, #FA7E1E 22%, #D62976 50%, #962FBF 75%, #4F5BD5 100%); }
  .site  { background: var(--pink); }

  .qr { width: 250px; flex: none; text-align: center; }
  .qr-box {
    position: relative;
    width: 250px; height: 250px;
    padding: 16px;
    border: 2px solid var(--line);
    border-radius: 24px;
    background: #fff;
  }
  .qr-box > img.code { width: 100%; height: 100%; display: block; }
  .qr-box > img.flor {
    position: absolute; left: 50%; top: 50%;
    width: 62px; height: 62px;
    transform: translate(-50%, -50%);
    background: #fff; border-radius: 50%; padding: 4px;
  }
  .qr p { margin-top: 12px; font-size: 19px; line-height: 1.3; color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
  <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
  <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>

  <main class="card">
    <div class="top">
    <img class="logo" src="../logo.jpg" alt="Néia Artesanatos">
    <p class="slogan">A matéria-prima da sua arte.</p>
    <div class="dots"></div>
    <p class="sub">Linhas para amigurumi · Kits · Tecidos · Aviamentos</p>
    </div>

    <div class="bottom">
      <div class="contacts">
        <div class="row">
          <span class="ico wpp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3Z"/></svg></span>
          (18) 99634-0125
        </div>
        <div class="row">
          <span class="ico insta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>
          @neia.artesanatos.ep
        </div>
        <div class="row">
          <span class="ico site"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></span>
          neiaartesanatos.com.br
        </div>
      </div>

      <div class="qr">
        <div class="qr-box">
          <img class="code" src="qrcode.svg" alt="">
          <img class="flor" src="../Flor_LOGO.png" alt="">
        </div>
        <p>Aponte a câmera<br>e veja todos os links</p>
      </div>
    </div>
  </main>
</body>
</html>
